name: Build Enlisted Planner V2 Full APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - "app/**"
      - "scripts/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Verify capability routes and privacy boundary
        run: python3 scripts/verify_source.py

      - name: Run unit-test task and build debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Prepare APK and checksum
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Enlisted-Planner-V2-Full-v3.apk
          sha256sum dist/Enlisted-Planner-V2-Full-v3.apk > dist/Enlisted-Planner-V2-Full-v3.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: Enlisted-Planner-V2-Full-v3
          path: |
            dist/Enlisted-Planner-V2-Full-v3.apk
            dist/Enlisted-Planner-V2-Full-v3.apk.sha256
          if-no-files-found: error
          retention-days: 30
